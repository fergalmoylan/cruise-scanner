name: Build UI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - 'docs/cruise_prices_v2.csv'
      - '.github/workflows/build-ui.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_PUSH }}
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.7.0

      - name: Install deps & build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Copy latest CSV into published app
        run: |
          set -euo pipefail
          mkdir -p docs/app
          cp -f docs/cruise_prices_v2.csv docs/app/cruise_prices_v2.csv

      - name: Commit build + data to docs/app
        run: |
          set -euo pipefail
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add -A docs/app
          if git diff --cached --quiet; then
            echo "No UI/data changes to commit."
            exit 0
          fi
          git commit -m "Build UI"
          git push origin HEAD:main
